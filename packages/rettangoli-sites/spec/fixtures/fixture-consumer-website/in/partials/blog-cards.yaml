- 'section class="blog-cards"':
    - h2: ${title}
    - $for item, i in sort(collections.blogPost, "data.date", "desc"):
        - $if i < default(postLimit, 3):
            - $partial: post-card
              url: ${item.url}
              title: ${item.data.title}
              date: ${item.data.date}
