template:
  - h1: "${heading}"
  - todo-counter :items=${items}: ""
  - ul:
      - $for item in items:
          - li: "${item.label}"
  - button#addButton ?disabled=${isFull}: Add
  - button#clearButton: Clear
refs:
  addButton:
    eventListeners:
      click:
        action: addItem
        payload:
          label: New item
  clearButton:
    eventListeners:
      click:
        handler: handleClear
styles: {}
