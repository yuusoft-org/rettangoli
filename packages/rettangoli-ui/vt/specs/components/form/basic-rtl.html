---
title: "Basic - RTL - Arabic Text"
dir: rtl
specs:
  - 'Same layout as `basic.html`, with Arabic text, rendered with `dir="rtl"` on the document.'
---
<rtgl-view id="container" g="lg" h="100vh" w="100vw" wrap>
</rtgl-view>

<script>
  const form = document.createElement('rtgl-form');
  form.id = 'form';
  form.setAttribute('w', '300');

  form.defaultValues = {}

  form.form = {
    title: 'عنوان النموذج',
    description: 'وصف النموذج',
    fields: [{
      name: 'email',
      type: 'input-text',
      label: 'البريد الإلكتروني',
      description: 'أدخل بريدك الإلكتروني',
      required: true,
    }, {
      name: 'password',
      type: 'input-text',
      label: 'كلمة المرور',
      inputType: 'password',
      description: 'أدخل كلمة المرور',
      required: true,
    }, {
      name: 'age',
      type: 'input-number',
      label: 'العمر',
      description: 'أدخل عمرك',
      required: true,
    }, {
      name: 'comments',
      type: 'input-textarea',
      label: 'التعليقات',
      description: 'هل لديك تعليقات إضافية؟',
      placeholder: 'اكتب تعليقاتك هنا...',
      required: false,
      rows: 12,
    }],
    actions: {
      buttons: [{
        id: 'submit',
        variant: 'pr',
        label: 'إرسال',
      }],
    }
  }

  form.addEventListener('form-action', (e) => {
    console.log('form-action', e.detail);
  });

  form.addEventListener('form-change', (e) => {
    console.log('form-change', e.detail);
  });

  document.getElementById('container').appendChild(form);
</script>
