---
title: "Slider Input With Slider Range"
viewport:
  id: form-compact
  width: 700
  height: 400
---
<rtgl-view id="container" g="lg" h="100vh" w="100vw" wrap>
</rtgl-view>

<script>
  const form = document.createElement('rtgl-form');
  form.setAttribute('w', '400');

  form.defaultValues = {
    fontSize: 200,
    lineHeight: 1.5,
  };

  form.form = {
    title: 'Text Style',
    fields: [{
      name: 'fontSize',
      type: 'slider-with-input',
      label: 'Font Size',
      description: 'The slider runs 8-128; typed sizes reach 1-1000',
      min: 1,
      max: 1000,
      sliderMin: 8,
      sliderMax: 128,
      step: 1,
    }, {
      name: 'lineHeight',
      type: 'slider-with-input',
      label: 'Line Height',
      description: 'The slider runs 0.8-3; typed values reach 0.5-10',
      min: 0.5,
      max: 10,
      sliderMin: 0.8,
      sliderMax: 3,
      step: 0.1,
    }],
  };

  form.addEventListener('form-change', (e) => {
    console.log('form-change', e.detail);
  });

  document.getElementById('container').appendChild(form);
</script>
