<rtgl-view g="lg" h="100vh" w="f" wrap>
  <rtgl-breadcrumb id="breadcrumb">
  </rtgl-breadcrumb>
</rtgl-view>

<script>
  const breadcrumb = document.getElementById('breadcrumb');
  breadcrumb.items = [
    { label: "الإجراءات", id: "breadcrumb-actions", path: "/actions" },
    { label: "الموسيقى", id: "breadcrumb-bgm", path: "/actions/bgm" },
    { label: "اختيار الصوت", current: true }
  ];
  breadcrumb.render();
</script>
