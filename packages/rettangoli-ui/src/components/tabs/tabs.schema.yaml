componentName: rtgl-tabs
propsSchema:
  type: object
  properties:
    ariaLabel:
      type: string
      description: Accessible name for the tab list.
    s:
      type: string
      enum: [sm, md, lg]
      default: md
    items:
      type: array
      items:
        type: object
        properties:
          label:
            type: string
          id:
            type: string
          testId:
            type: string
    selectedTab:
      type: string
events:
  item-click:
    type: object
    properties:
      id:
        type: string
methods:
  type: object
  properties: {}
