componentName: rtgl-select
propsSchema:
  type: object
  properties:
    placeholder:
      type: string
    options:
      type: array
      items:
        type: object
        properties:
          type:
            type: string
            enum:
              - section
              - item
              - separator
          label:
            type: string
          value:
            type: any
          icon:
            type: string
          imageSrc:
            type: string
          shortcut:
            type: string
          suffixText:
            type: string
          testId:
            type: string
    selectedValue:
      type: any
    onChange:
      type: function
    noClear:
      type: boolean
    addOption:
      type: object
      properties:
        label:
          type: string
    image:
      type: object
      properties:
        size:
          type: number
          maximum: 28
        borderRadius:
          type: string
          enum:
            - xs
            - sm
            - md
            - lg
            - xl
            - full
        borderColor:
          type: string
          enum:
            - pr
            - se
            - de
            - fg
            - bg
            - su
            - mu
            - ac
            - bo
            - tr
        fit:
          type: string
          enum:
            - cover
            - contain
    disabled:
      type: boolean
    searchable:
      type: boolean
    searchPlaceholder:
      type: string
    emptySearchLabel:
      type: string
    w:
      type: string
events:
  value-change: {}
  add-option-click: {}
methods:
  type: object
  properties: {}
