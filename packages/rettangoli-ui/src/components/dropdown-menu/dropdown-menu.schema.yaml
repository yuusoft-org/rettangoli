componentName: rtgl-dropdown-menu
propsSchema:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/$defs/menuItem'
    open:
      type: boolean
    x:
      type: string
    'y':
      type: string
    place:
      type: string
    overlay:
      type: boolean
    no-overlay:
      type: boolean
    sm-place:
      type: string
    md-place:
      type: string
    lg-place:
      type: string
    xl-place:
      type: string
    sm-overlay:
      type: boolean
    md-overlay:
      type: boolean
    lg-overlay:
      type: boolean
    xl-overlay:
      type: boolean
    sm-no-overlay:
      type: boolean
    md-no-overlay:
      type: boolean
    lg-no-overlay:
      type: boolean
    xl-no-overlay:
      type: boolean
    w:
      type: string
    h:
      type: string
    aria-label:
      type: string
  $defs:
    menuItem:
      type: object
      properties:
        label:
          type: string
        type:
          type: string
          enum:
            - section
            - item
            - separator
            - label
        id:
          type: string
        icon:
          type: string
        path:
          type: string
        href:
          type: string
        shortcut:
          type: string
        suffixText:
          type: string
        disabled:
          type: boolean
        newTab:
          type: boolean
        rel:
          type: string
        testId:
          type: string
        items:
          type: array
          items:
            $ref: '#/$defs/menuItem'
events:
  close:
    type: object
  item-click:
    type: object
    properties:
      index:
        type: number
      indexPath:
        type: array
        items:
          type: number
      item:
        type: object
      id:
        type: string
      path:
        type: string
      href:
        type: string
      trigger:
        type: string
methods:
  type: object
  properties: {}
