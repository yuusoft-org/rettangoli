componentName: rtgl-form
propsSchema:
  type: object
  properties:
    form:
      type: object
    defaultValues:
      type: object
    context:
      type: object
    disabled:
      type: boolean
    sticky:
      type: boolean
    p:
      type: string
      enum: [none, xs, sm, md, lg, xl]
      default: md
    ph:
      type: string
      enum: [none, xs, sm, md, lg, xl]
    pv:
      type: string
      enum: [none, xs, sm, md, lg, xl]
events:
  form-input: {}
  form-change: {}
  form-field-event: {}
  form-section-action: {}
  form-action: {}
methods:
  type: object
  properties:
    getValues:
      type: function
    setValues:
      type: function
    validate:
      type: function
    reset:
      type: function
