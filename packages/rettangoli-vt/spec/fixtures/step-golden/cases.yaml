# Step engine golden cases (see ../../step-engine-golden.spec.js).
#
# Each case replays one raw step through createSteps() against the recording page
# (spec/support/recording-page.js) under its listed personalities (default: [default]).
# The call log and error message are frozen in golden.json.
#
#   id:            unique, dotted: <action-or-area>.<variant>
#   step:          the raw step exactly as it would appear in a spec's frontmatter
#   personalities: optional, subset of the personalities in recording-page.js
#   bug:           optional bug tag for cases whose current behavior is a known bug;
#                  only the change fixing that bug may change those goldens
#
# After an intentional change: UPDATE_GOLDEN=1 node spec/support/record-goldens.mjs
